<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>CowBoy</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <img class="header__logo" src="img/logo.png" alt="logo cowBoy" />
          <nav class="header__menu menu">
            <ul class="menu__list">
              <li class="menu__item">
                <a href="#" class="menu__link">Home</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__link">Models</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__link">Download</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__link">Video</a>
              </li>
            </ul>
          </nav>
          <a href="#" class="header__button">Order now</a>
        </div>
      </header>
      <main class="page">
        <section class="page__hero hero">
          <div class="hero__container">
            <div class="hero__content">
              <h1 class="hero__title">The Future of Urban Mobility</h1>
              <div class="hero__text">
                <p>
                  Experience the ride of your life with Cowboy’s sleek, smart, and powerful electric bikes designed for urban adventurers.
                </p>
              </div>
              <div class="hero__butttons">
                <a href="#" class="hero__button button button--dark">Explore Models</a>
                <a href="#" class="hero__button button">Start Your Ride</a>
              </div>
            </div>
            <figure class="hero__picture">
              <img src="img/hero/01.png" class="hero__img" alt="hero image" />
            </figure>
          </div>
        </section>
      </main>
      <footer class="footer"></footer>
    </div>
  </body>
</html>
