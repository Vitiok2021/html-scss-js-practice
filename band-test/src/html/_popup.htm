<div id="popup" aria-hidden="true" class="popup">
  <div class="popup__wrapper">
    <div class="popup__content">
      <button data-close type="button" class="popup__close">Закрити</button>
      <div class="popup__text">
        <h2 class="popup__title">Замовити квиток</h2>

        <form action="#" method="GET" class="form" id="popupForm">
          <div class="form__row">
            <div class="form__group">
              <label for="popupName" class="form__label">Ім'я</label>
              <input type="text" id="popupName" name="name" class="form__input" required />
            </div>
            <div class="form__group">
              <label for="popupEmail" class="form__label">Email</label>
              <input type="email" id="popupEmail" name="email" class="form__input" required />
            </div>
          </div>

          <div class="form__group">
            <label for="popupMessage" class="form__label">Деталі</label>
            <textarea
              id="popupMessage"
              name="message"
              class="form__textarea"
              placeholder="Вкажіть місто та кількість квитків..."
              required
            ></textarea>
          </div>

          <button type="submit" class="form__btn btn">Відправити заявку</button>
          <div id="popupFormMessage" class="form__message"></div>
        </form>
      </div>
    </div>
  </div>
</div>
